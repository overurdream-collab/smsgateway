name: FIN25 Android integration build

on:
  push:
    branches: ['integration/maqwati-samsung-secure-20261117', 'fix/fin25-worker-diagnostics-20261118', 'fix/fin25-resume-validation-20261118']
  pull_request:
    branches: [main, integration/maqwati-samsung-secure-20261117]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin25-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test read-only preflight without Docker or SMS
        shell: pwsh
        run: ./scripts/test-fin25-preflight.ps1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager "$SDK_ROOT"/tools/bin/sdkmanager; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK and run unit tests
        run: gradle --no-daemon --stacktrace assembleDebug testDebugUnitTest

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin25-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK signature and record fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature-report.txt
          sha256sum "$APK" | tee apk-sha256.txt
          echo "Debug certificate is NOT a production release signing certificate." >> apk-signature-report.txt

      - name: Upload signature verification report
        uses: actions/upload-artifact@v4
        with:
          name: fin25-apk-verification
          path: |
            apk-signature-report.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify debug APK signature and application identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "^package: name='com.test4.smsgateway.fin25sandbox2026'"
          sha256sum "$APK" | tee app-debug.apk.sha256
          echo "Debug APK only; certificate is generated by CI and is not an upgrade key for an existing installation."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fin25-samsung-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
